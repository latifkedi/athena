open:
  - tr: Yetişkinlikte oluşan nöronlar, varsa, hafıza ve duygu düzenlemesinde ne kadar rol oynar?
    en: If neurons form in adulthood, how much do they contribute to memory and emotional regulation?
related: [noron-doktrini]
