    authors: John Paul II
    title: 'Message to the Pontifical Academy of Sciences: On Evolution (22 October 1996)'
    year: 1996
    in: "L'Osservatore Romano (English edition), 30 October 1996"
  numbers2006:
    type: book
    authors: Numbers, R. L.
    title: 'The Creationists: From Scientific Creationism to Intelligent Design'
    year: 2006
    in: Harvard University Press, expanded edition
  dawkins2006:
