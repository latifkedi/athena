    title: Global meta-analysis reveals no net change in local-scale plant biodiversity over time
    year: 2013
    in: Proceedings of the National Academy of Sciences 110(48), 19456–19459
    doi: 10.1073/pnas.1312779110
open:
  - tr: Günümüzdeki yok oluşların gerçek hızı nedir ve ne kadarı henüz fark edilmemiştir?
    en: What is the true rate of today's extinctions, and how many have not yet been noticed?
related: [ekosistem, kuresel-isinma]
