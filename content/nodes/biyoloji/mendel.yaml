    authors: Fisher, R. A.
    title: "Has Mendel's work been rediscovered?"
    year: 1936
    in: Annals of Science 1(2), 115–137
    doi: 10.1080/00033793600200111
  franklin2008:
    type: book
    authors: Franklin, A.; Edwards, A. W. F.; Fairbanks, D. J.; Hartl, D. L.; Seidenfeld, T.
    title: Ending the Mendel–Fisher Controversy
    year: 2008
    in: University of Pittsburgh Press
