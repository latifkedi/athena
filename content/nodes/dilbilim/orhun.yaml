positions:
  - who:
      tr: Vilhelm Thomsen
      en: Vilhelm Thomsen
    tr: Yazının çözümü "Tengri", "Türk" ve "Kül Tigin" sözcüklerinin tanınmasıyla başladı.
    en: The decipherment began with the recognition of the words "Tengri", "Türk" and "Kül Tigin".
    src: [thomsen1893]
