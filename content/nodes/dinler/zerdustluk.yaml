    url: https://www.iranicaonline.org/articles/zoroaster-ii-general-survey/
  iranica-zoroastrianism:
    type: encyclopedia
    title: 'Zoroastrianism i. Historical review up to the Arab conquest'
    in: Encyclopaedia Iranica
    url: https://www.iranicaonline.org/articles/zoroastrianism-i-historical-review/
open:
  - tr: Zerdüşt tam olarak ne zaman ve nerede yaşadı?
    en: When and where exactly did Zarathustra live?
