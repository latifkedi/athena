claims:
  - tr: '"Algoritma" kelimesi Harezmî adının Latince biçiminden (Algoritmi) türemiştir.'
    en: 'The word "algorithm" derives from the Latin form of al-Khwārizmī''s name (Algoritmi).'
    src: [mactutor]
