claims:
  - tr: Matematiksel bilginin kaynağı ve doğası (keşif mi, icat mı) felsefede tartışmalıdır. Platoncu, biçimci, sezgici ve yapılandırmacı görüşler vardır.
    en: The source and nature of mathematical knowledge (discovered or invented?) is debated in philosophy. There are Platonist, formalist, intuitionist and constructivist views.
    src: [sep-philmath]
