id: p-degeri
parent: matematik
type: question
date: { year: 1925 }
people: [Ronald Fisher, Jerzy Neyman, Egon Pearson, Ronald Wasserstein, Daniel Benjamin, Valentin Amrhein, Daniël Lakens]
title:
  tr: P-değeri ve istatistiksel anlamlılık tartışması
  en: The p-value and the statistical significance debate
summary:
  tr: >-
    Bilimsel çalışmalarda bir sonucun "istatistiksel olarak anlamlı" sayılması için çoğunlukla p < 0,05 eşiği kullanılır.
    Bu gelenek büyük ölçüde Ronald Fisher'ın 1925 tarihli kitabına dayanır. Tekrarlama krizinin ardından, p-değerlerinin
    yanlış yorumlandığı ve tek bir eşiğe bağlanmanın yanıltıcı sonuçlara yol açtığı yaygın biçimde tartışılmaya başlandı.
    Amerikan İstatistik Derneği 2016'da bu konuda bir bildiri yayımladı. Araştırmacılar önerilen çözümler konusunda
    ayrışır.
  en: >-
    In scientific studies the threshold p < 0.05 is usually used to count a result as "statistically significant". The
    tradition rests largely on Ronald Fisher's book of 1925. After the replication crisis it became widely debated that
    p-values are misinterpreted and that tying conclusions to a single threshold leads to misleading results. The
    American Statistical Association issued a statement on the matter in 2016. Researchers disagree on the proposed
    remedies.
technical:
  tr: >-
    P-değeri, sıfır hipotezi ve modelin tüm varsayımları doğruysa, en az gözlenen kadar uç bir sonuç elde etme
    olasılığıdır. Sıfır hipotezinin doğru olma olasılığı değildir. Fisher p-değerini kanıtın gücünün sürekli bir ölçüsü
    olarak görüyordu. Neyman ve Pearson ise önceden belirlenmiş hata oranlarıyla karar vermeyi öneriyordu. Bugünkü
    uygulama bu iki yaklaşımın bir karışımıdır. Düşük istatistiksel güç, esnek analiz seçimleri ve yalnızca anlamlı
    sonuçların yayımlanması, yanlış pozitif oranını artırır.
  en: >-
    The p-value is the probability of obtaining a result at least as extreme as the one observed if the null hypothesis
    and all the model's assumptions are true; it is not the probability that the null hypothesis is true. Fisher saw the
    p-value as a continuous measure of the strength of evidence, while Neyman and Pearson proposed making decisions with
    pre-set error rates. Today's practice is a hybrid of the two. Low statistical power, flexible analysis choices and the
    publication of significant results only raise the false positive rate.
claims:
  - tr: P-değerleri tek başına bir hipotezin doğru olma olasılığını ya da bir etkinin büyüklüğünü göstermez. Bilimsel sonuçlar yalnızca bir anlamlılık eşiğinin aşılmasına dayanmamalıdır.
    en: P-values alone show neither the probability that a hypothesis is true nor the size of an effect; scientific conclusions should not rest only on passing a significance threshold.
    src: [asa2016]
positions:
  - who:
      tr: Eşiği düşürmeyi önerenler (Benjamin ve 71 ortak yazar)
      en: Those proposing a lower threshold (Benjamin and 71 co-authors)
    tr: Yeni keşifler için varsayılan anlamlılık eşiği 0,05'ten 0,005'e düşürülmelidir.
    en: The default significance threshold for new discoveries should be lowered from 0.05 to 0.005.
    src: [benjamin2018]
  - who:
      tr: Anlamlılık kavramını bırakmayı önerenler (Amrhein ve 800'den fazla imzacı)
      en: Those proposing to retire significance (Amrhein and more than 800 signatories)
    tr: “İstatistiksel anlamlılık” kavramı tümüyle bırakılmalı, p-değerleri güven aralıklarıyla birlikte sürekli değerler olarak raporlanmalıdır.
    en: The concept of "statistical significance" should be retired altogether, and p-values reported as continuous values together with confidence intervals.
    src: [amrhein2019]
  - who:
      tr: Eşiğin gerekçelendirilmesini önerenler (Lakens ve ortak yazarlar)
      en: Those proposing to justify the threshold (Lakens and co-authors)
    tr: Tek bir evrensel eşik yerine her araştırmacı, çalışmasının koşullarına göre seçtiği eşiği önceden gerekçelendirmelidir.
    en: Instead of one universal threshold, each researcher should justify in advance the threshold chosen for the conditions of their study.
    src: [lakens2018]
  - who:
      tr: Bayesçi yöntemleri önerenler
      en: Those proposing Bayesian methods
    tr: Hipotezlerin göreli desteği Bayes faktörleri ve sonsal dağılımlarla doğrudan ölçülmelidir.
    en: The relative support for hypotheses should be measured directly with Bayes factors and posterior distributions.
    src: [benjamin2018]
