open:
  - tr: Bilinçli bir kararın beyin etkinliğiyle zamanlaması, sorumluluk ve özgürlük tartışmasında ne kadar belirleyicidir?
    en: How much does the timing of a conscious decision relative to brain activity matter for the debate on responsibility and freedom?
related: [mutezile, esarilik, maturidilik, bilinc, stoacilik]
