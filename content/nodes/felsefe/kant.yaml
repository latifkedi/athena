      en: "Kant's critique of the proofs of God"
    tr: Varlık gerçek bir yüklem değildir. Bu nedenle Tanrı kavramından Tanrı'nın varlığı çıkarılamaz.
    en: Existence is not a real predicate, so God's existence cannot be derived from the concept of God.
