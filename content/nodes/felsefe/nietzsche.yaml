open:
  - tr: Güç istenci ve bengi dönüş metafizik iddialar mı, yoksa bir yaşam tavrını anlatan düşünce deneyleri mi?
    en: Are the will to power and eternal recurrence metaphysical claims, or thought experiments describing an attitude to life?
related: [varolusculuk]
