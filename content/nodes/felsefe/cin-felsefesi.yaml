positions:
  - who:
      tr: Daoculuk
      en: Daoism
    tr: Toplumsal kurallar ve zorlama yerine doğanın kendiliğinden işleyişine uyum aranmalıdır.
    en: Harmony with the spontaneous workings of nature should be sought instead of social rules and force.
    src: [sep-laozi]
