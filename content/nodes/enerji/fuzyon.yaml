open:
  - tr: Füzyon ne zaman şebekeye net elektrik verebilecek? ITER ve özel girişimlerin hedef tarihleri sık sık ertelenmiştir.
    en: When will fusion deliver net electricity to the grid? The target dates of ITER and private ventures have often slipped.
