      tr: Kardaşev (1964)
      en: Kardashev (1964)
    tr: Enerji kullanımı, uzaydan tespit edilebilecek medeniyetlerin sınıflandırılması için uygun bir ölçüttür.
    en: Energy use is a suitable measure for classifying civilisations that might be detected from space.
    src: [kardashev1964]
