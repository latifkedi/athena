id: soguk-fuzyon
parent: enerji
type: idea
date: { year: 1989, month: 3 }
people: [Martin Fleischmann, Stanley Pons]
title:
  tr: Soğuk füzyon (düşük enerjili nükleer tepkimeler)
  en: Cold fusion (low-energy nuclear reactions)
summary:
  tr: >-
    Fleischmann ve Pons 1989'da, oda sıcaklığında paladyum elektrotlu bir elektroliz hücresinde kimyasal tepkimelerle
    açıklanamayacak fazla ısı ölçtüklerini ve bunun çekirdek birleşmesinden gelebileceğini açıkladı. Pek çok laboratuvar
    sonucu tekrarlayamadı. Bir grup araştırmacı ise "LENR" adıyla çalışmaları sürdürüyor.
  en: >-
    In 1989 Fleischmann and Pons announced that they had measured excess heat, not explainable by chemistry, in an
    electrolysis cell with a palladium electrode at room temperature, and that it might come from nuclear fusion. Many
    laboratories could not reproduce the result. A group of researchers continues the work under the name "LENR".
technical:
  tr: >-
    İddia, ağır suyun paladyum katotta elektrolizi sırasında deuteronların kafes içinde kaynaşarak ısı açığa çıkardığıdır.
    Beklenen nötron ve trityum miktarları ölçülen ısıyla orantılı bulunmadı. Caltech, MIT ve Harwell'deki tekrar
    deneyleri olumsuz sonuç verdi. ABD Enerji Bakanlığı 1989 ve 2004'te konuyu değerlendirdi. 2004 değerlendirmesinde
    panelistlerin görüşleri bölündü ve belirli sorular için ek araştırma önerildi. Google'ın desteklediği 2019
    tarihli çok kurumlu bir program da fazla ısı veya nükleer ürün bulamadı. Ancak programın, test edilen koşulların
    iddiayı tamamen dışlamadığını belirttiği de not edildi.
  en: >-
    The claim is that during electrolysis of heavy water on a palladium cathode, deuterons fuse within the lattice and
    release heat. The expected amounts of neutrons and tritium were not found in proportion to the measured heat.
    Replication attempts at Caltech, MIT and Harwell were negative. The US Department of Energy reviewed the subject in
    1989 and 2004; in 2004 panellists were divided and further research on specific questions was recommended. A
    multi-institution programme funded by Google in 2019 also found no excess heat or nuclear products, while noting that
    the conditions tested did not rule the claim out entirely.
claims:
  - tr: Paladyum içinde deuteryum, oda sıcaklığında kimyasal kaynaklı olmayan fazla ısı üretebilir.
    en: Deuterium in palladium can produce excess heat of non-chemical origin at room temperature.
    src: [fleischmann1989, storms2007]
evidence:
  - kind: experiment
    stance: for
    tr: Özgün deneyde, girdi gücünü aşan ve kimyasal tepkimelerle açıklanamayacak ısı ölçüldüğü bildirildi.
    en: The original experiment reported heat exceeding input power that could not be explained by chemical reactions.
    src: [fleischmann1989]
  - kind: experiment
    stance: for
    tr: LENR araştırmacıları sonraki yıllarda fazla ısı bildiren çok sayıda deney derledi.
    en: LENR researchers have compiled many later experiments reporting excess heat.
    src: [storms2007]
  - kind: replication
    stance: against
    tr: Caltech'te yapılan ayrıntılı tekrar deneyinde fazla ısı, nötron, gama ışını ya da trityum bulunmadı.
    en: A detailed replication at Caltech found no excess heat, neutrons, gamma rays or tritium.
    src: [lewis1989]
  - kind: replication
    stance: against
    tr: 2019'daki çok kurumlu program, fazla ısıya ya da nükleer ürünlere dair kanıt bulamadı.
    en: The 2019 multi-institution programme found no evidence of excess heat or nuclear products.
    src: [berlinguette2019]
positions:
  - who:
      tr: ABD Enerji Bakanlığı değerlendirmesi (2004)
      en: US Department of Energy review (2004)
    tr: Panelistlerin çoğu fazla ısı kanıtını ikna edici bulmadı. Belirli sorulara yönelik iyi tasarlanmış deneylerin desteklenmesi önerildi.
    en: Most panellists did not find the evidence for excess heat convincing; support for well-designed experiments on specific questions was recommended.
    src: [doe2004]
