id: tas-aletler
parent: ilk-bilgiler
type: technology
order: 1
title:
  tr: Taş aletler
  en: Stone tools
summary:
  tr: >-
    Taşı yontarak kesici alet yapmak, insan soyuna atfedilen en eski teknolojidir. Bilinen en eski örneklerin kaç yaşında
    olduğu ve kimin yaptığı hâlâ tartışılmaktadır.
  en: >-
    Knapping stone into cutting tools is the oldest technology attributed to the human lineage. How old the earliest
    known examples are, and who made them, is still debated.
technical:
  tr: >-
    Lomekwi 3 (Kenya) buluntuları, stratigrafik bağlam ve 40Ar/39Ar ile tarihlenmiş tüf katmanlarına göre yaklaşık 3,3
    milyon yıl öncesine yerleştirilir ve "Lomekwiyen" endüstrisi olarak adlandırılır. Daha önce en eski kabul edilen
    Olduvai (Oldowan) tipi aletler Gona'da (Etiyopya) yaklaşık 2,6–2,5 milyon yıla tarihlenir. Tartışma, Lomekwi
    buluntularının yerinde (in situ) olup olmadığı ve tarihlendirilen katmanla ilişkisi üzerinde yoğunlaşır. Dikika'da
    3,39 milyon yıllık kemiklerdeki izlerin kasaplık izi mi yoksa çiğneme/ezilme izi mi olduğu da tartışmalıdır.
  en: >-
    The Lomekwi 3 (Kenya) finds are placed at about 3.3 million years ago on the basis of stratigraphic context and
    40Ar/39Ar-dated tuffs, and are called the "Lomekwian" industry. Oldowan tools, previously considered the oldest,
    date to about 2.6–2.5 million years at Gona (Ethiopia). The debate centres on whether the Lomekwi finds were in
    situ and on their relation to the dated layer. Whether marks on 3.39-million-year-old bones at Dikika are
    butchery marks or trampling damage is also disputed.
datings:
  - view:
      tr: Arkeoloji (Lomekwi 3, Kenya)
      en: Archaeology (Lomekwi 3, Kenya)
    value:
      tr: Yaklaşık 3,3 milyon yıl önce
      en: About 3.3 million years ago
    src: [harmand2015]
  - view:
      tr: Arkeoloji (Gona, Etiyopya; Olduvai tipi)
      en: Archaeology (Gona, Ethiopia; Oldowan)
    value:
      tr: Yaklaşık 2,6–2,5 milyon yıl önce
      en: About 2.6–2.5 million years ago
    src: [semaw1997]
claims:
  - tr: Kasıtlı olarak yontulmuş taş aletler Homo cinsinin ortaya çıkışından önce yapılmıştır.
    en: Deliberately knapped stone tools were made before the appearance of the genus Homo.
    src: [harmand2015]
  - tr: Taş aletlerle hayvan kesimi 3,39 milyon yıl önce yapılıyordu.
    en: Animals were butchered with stone tools 3.39 million years ago.
    src: [mcpherron2010]
evidence:
  - kind: archaeological
    stance: for
    tr: Lomekwi 3'te 149 taş eser bulundu; bir kısmı tarihlendirilen tüf katmanının içinde yer alıyordu.
    en: 149 stone artefacts were recovered at Lomekwi 3, some embedded in the dated tuff layer.
    src: [harmand2015]
  - kind: archaeological
    stance: for
    tr: Dikika'da (Etiyopya) 3,39 milyon yıllık hayvan kemiklerinde kesme ve vurma izlerine benzeyen izler bulundu.
    en: Marks resembling cut and percussion marks were found on 3.39-million-year-old animal bones at Dikika (Ethiopia).
    src: [mcpherron2010]
  - kind: critique
    stance: against
    tr: Lomekwi eserlerinin bir kısmının yüzeyden toplandığı ve katmanla ilişkisinin yeterince gösterilmediği ileri sürüldü; daha fazla kanıt istendi.
    en: It was argued that some Lomekwi artefacts were surface finds and that their association with the dated layer was insufficiently shown; more evidence was requested.
    src: [dominguez2016]
  - kind: critique
    stance: against
    tr: Dikika kemiklerindeki izlerin, hayvanların çiğnemesi ve tortu içinde ezilmeyle oluşan izlerle karıştırılabileceği savunuldu.
    en: It was argued that the Dikika marks can be confused with damage from trampling and sediment abrasion.
    src: [dominguez2010]
