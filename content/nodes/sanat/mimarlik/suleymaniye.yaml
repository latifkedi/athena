    stance: for
    tr: Sinan'ın anılarını aktaran 16. yüzyıl metinleri, yapılarının listesini ve kendi eserleri hakkındaki değerlendirmelerini içerir.
    en: 16th-century texts recording Sinan's memoirs contain the list of his buildings and his own assessments of his works.
    src: [crane-akin2006]
