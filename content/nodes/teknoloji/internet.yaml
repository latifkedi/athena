    type: report
    authors: Berners-Lee, T.
    title: 'Information Management: A Proposal'
    year: 1989
    in: CERN
    url: https://www.w3.org/History/1989/proposal.html
evidence:
  - kind: historical
    stance: for
    tr: Berners-Lee'nin 1989 önerisi, CERN'deki belgeleri birbirine bağlayan dağıtık bir hipermetin sistemini tarif eder. Bu öneri Web'in temeli oldu.
    en: Berners-Lee's 1989 proposal describes a distributed hypertext system linking documents at CERN, which became the basis of the Web.
    src: [berners-lee1989]
