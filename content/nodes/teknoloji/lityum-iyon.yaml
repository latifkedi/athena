id: lityum-iyon
parent: teknoloji
type: technology
date: { year: 1991 }
people: [M. Stanley Whittingham, John B. Goodenough, Akira Yoshino, Koichi Mizushima]
title:
  tr: Lityum iyon pil
  en: The lithium-ion battery
summary:
  tr: >-
    Lityum iyon piller, lityum iyonlarının şarj ve deşarj sırasında iki elektrot arasında gidip gelmesiyle çalışır. Hafif
    ve çok kez şarj edilebilir oldukları için telefonları, bilgisayarları ve elektrikli araçları mümkün kıldılar. İlk
    ticari lityum iyon pil 1991'de satışa sunuldu. Whittingham, Goodenough ve Yoshino bu çalışmalarla 2019 Nobel Kimya
    Ödülü'nü paylaştı. Kobalt ve lityum madenciliğinin çevresel ve toplumsal etkileri ile geri dönüşüm önemli
    tartışma konularıdır.
  en: >-
    Lithium-ion batteries work by lithium ions moving back and forth between two electrodes during charging and
    discharging. Because they are light and can be recharged many times, they made phones, laptops and electric vehicles
    possible. The first commercial lithium-ion battery went on sale in 1991. Whittingham, Goodenough and Yoshino shared
    the 2019 Nobel Prize in Chemistry for this work. The environmental and social effects of cobalt and lithium mining
    and recycling are important topics of debate.
technical:
  tr: >-
    Whittingham 1970'lerde titanyum disülfür katot ile lityum metal anottan oluşan bir pil geliştirdi, ancak lityum metal
    güvenlik sorunlarına yol açıyordu. Goodenough ve ekibi 1980'de lityum kobalt oksidin (LiCoO₂) yaklaşık 4 voltluk
    yüksek bir gerilim sağladığını gösterdi. Yoshino 1985'te lityum metal yerine karbon esaslı bir anot kullanarak daha
    güvenli bir tasarım yaptı. Sony bu tasarıma dayanan pili 1991'de piyasaya sürdü.
  en: >-
    In the 1970s Whittingham developed a battery with a titanium disulfide cathode and a lithium metal anode, but lithium
    metal caused safety problems. In 1980 Goodenough's group showed that lithium cobalt oxide (LiCoO₂) gives a high voltage
    of about 4 volts. In 1985 Yoshino made a safer design by using a carbon-based anode instead of lithium metal. Sony
    brought a battery based on this design to market in 1991.
claims:
  - tr: Lityum iyonları, katmanlı bir katot malzemesinin yapısına zarar vermeden defalarca girip çıkabilir ve bu, yüksek enerji yoğunluklu şarj edilebilir bir pil sağlar.
    en: Lithium ions can move into and out of a layered cathode material many times without damaging its structure, giving a rechargeable battery of high energy density.
    src: [whittingham1976, mizushima1980]
evidence:
  - kind: experiment
    stance: for
    tr: LixCoO₂ ile yapılan ölçümlerde açık devre geriliminin lityum metale göre yaklaşık 4 volt olduğu ve kuramsal enerji yoğunluğunun yüksek olduğu bulundu.
    en: Measurements with LixCoO₂ found an open-circuit voltage of about 4 volts against lithium metal and a high theoretical energy density.
    src: [mizushima1980]
