id: kuresel-isinma
parent: iklim
type: question
date: { year: 2021, month: 8 }
people: [IPCC, WMO]
title:
  tr: Günümüzdeki küresel ısınma ve nedenleri
  en: Present-day global warming and its causes
summary:
  tr: >-
    Dünya Meteoroloji Örgütü'ne göre 2025, sanayi öncesi döneme göre yaklaşık 1,43 °C daha sıcaktı. 2015–2025 arasındaki
    11 yıl, kayıtların en sıcak yıllarıdır. BM'nin iklim paneli IPCC, 2021'de bu ısınmanın insan faaliyetlerinden
    kaynaklandığının "kesin" olduğunu bildirdi. Bazı bilim insanları ise Güneş ve kozmik ışınlar gibi doğal etkenlerin
    rolünün küçümsendiğini ya da iklimin CO₂'ye duyarlılığının abartıldığını savunmaktadır.
  en: >-
    According to the World Meteorological Organization, 2025 was about 1.43 °C warmer than pre-industrial times, and the
    11 years 2015–2025 are the warmest on record. The UN's climate panel, the IPCC, stated in 2021 that it is
    "unequivocal" that this warming is caused by human activities. Some scientists argue that the role of natural factors
    such as the Sun and cosmic rays is underestimated, or that the climate's sensitivity to CO₂ is exaggerated.
technical:
  tr: >-
    IPCC AR6, 2010–2019 dönemi için gözlenen yaklaşık 1,07 °C'lik insan kaynaklı ısınmanın en iyi tahmininin gözlenen
    ısınmanın tamamına denk geldiğini bildirdi. Güneş ışınımı ölçümleri 1980'lerden bu yana artış göstermez. Kozmik ışınların
    bulut oluşumu üzerinden iklimi etkilediği hipotezi (Svensmark), CERN'deki CLOUD deneyinde çekirdeklenme üzerinde bir
    etki gösterse de, bu etkinin iklim açısından küçük olduğu değerlendirildi. Lindzen ve Choi, uydu verilerinden düşük
    (yaklaşık 0,7 °C) iklim duyarlılığı çıkardı. Bu analiz başka araştırmacılarca yöntemsel olarak eleştirildi.
  en: >-
    IPCC AR6 reported that the best estimate of human-caused warming for 2010–2019, about 1.07 °C, matches the whole of
    the observed warming. Solar irradiance measurements show no increase since the 1980s. The hypothesis that cosmic rays
    affect climate through cloud formation (Svensmark) showed an effect on nucleation in CERN's CLOUD experiment, but the
    effect was judged small for climate. Lindzen and Choi derived a low climate sensitivity (about 0.7 °C) from satellite
    data; the analysis was criticised methodologically by other researchers.
claims:
  - tr: 1950'lerden bu yana gözlenen küresel ısınmanın başlıca nedeni insan kaynaklı sera gazı salımlarıdır.
    en: The main cause of the global warming observed since the 1950s is human greenhouse-gas emissions.
    src: [ipcc2021]
evidence:
  - kind: measurement
    stance: for
    tr: 2025 yılı sanayi öncesine göre yaklaşık 1,43 °C daha sıcaktı. Son 11 yıl kayıtların en sıcak 11 yılıdır. Sera gazı derişimleri ve okyanus ısı içeriği rekor düzeydedir.
    en: 2025 was about 1.43 °C warmer than pre-industrial; the last 11 years are the 11 warmest on record; greenhouse-gas concentrations and ocean heat content are at record levels.
    src: [wmo2025]
  - kind: statistical
    stance: for
    tr: İklim konusunda görüş bildiren 4.000'den fazla hakemli makale özetinin yaklaşık %97'si insan kaynaklı ısınma görüşünü destekledi.
    en: About 97% of more than 4,000 peer-reviewed paper abstracts expressing a position endorsed human-caused warming.
    src: [cook2013]
  - kind: critique
    stance: against
    tr: Yüzde 97 uzlaşı çalışmasının sınıflandırma yöntemine ve örneklemine yönelik eleştiriler yayımlandı. Yazarlar bu eleştirilere yanıt verdi.
    en: Criticisms of the classification method and sample of the 97% consensus study were published; the authors responded.
    src: [tol2016, cook2016]
  - kind: theoretical
    stance: against
    tr: Kozmik ışınların bulut oluşumunu etkileyerek iklim üzerinde Güneş etkinliğine bağlı önemli bir rol oynadığı öne sürüldü.
    en: It was proposed that cosmic rays play a significant, solar-activity-linked role in climate by affecting cloud formation.
    src: [svensmark1997]
  - kind: experiment
    stance: for
    tr: CERN'deki CLOUD deneyi, iyonlaşmanın parçacık çekirdeklenmesini artırdığını ancak bunun bulut yoğunlaşma çekirdekleri üzerindeki etkisinin küçük olduğunu gösterdi.
    en: The CLOUD experiment at CERN showed that ionisation enhances particle nucleation but that its effect on cloud condensation nuclei is small.
    src: [kirkby2011, pierce2009]
  - kind: measurement
    stance: against
    tr: Uydu ışınım verilerinin analizine dayanarak iklim duyarlılığının ana akım tahminlerden çok daha düşük olduğu savunuldu.
    en: Based on analysis of satellite radiation data, it was argued that climate sensitivity is much lower than mainstream estimates.
    src: [lindzen2011]
