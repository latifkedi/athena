    authors: Tyndall, J.
    title: On the absorption and radiation of heat by gases and vapours, and on the physical connexion of radiation, absorption, and conduction
    year: 1861
    in: Philosophical Transactions of the Royal Society of London 151, 1–36
    doi: 10.1098/rstl.1861.0001
  arrhenius1896:
    type: article
    authors: Arrhenius, S.
    title: On the influence of carbonic acid in the air upon the temperature of the ground
    year: 1896
    in: Philosophical Magazine 41, 237–276
    doi: 10.1080/14786449608620846
related: [termodinamik]
