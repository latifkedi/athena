id: maxwell
parent: fizik
type: event
date: { year: 1865 }
people: [James Clerk Maxwell, Michael Faraday, Heinrich Hertz]
title:
  tr: Maxwell denklemleri ve ışık
  en: "Maxwell's equations and light"
summary:
  tr: >-
    Maxwell elektrik ve manyetizmayı tek bir kuramda birleştirdi ve bu kurama göre elektromanyetik dalgaların ışık
    hızında yayılması gerektiğini hesapladı. Buradan ışığın bir elektromanyetik dalga olduğu sonucunu çıkardı. Hertz
    1887–1888'de bu dalgaları deneyle üretti. Radyo, televizyon ve kablosuz iletişimin temeli budur.
  en: >-
    Maxwell unified electricity and magnetism in a single theory and calculated that electromagnetic waves should travel
    at the speed of light. From this he concluded that light is an electromagnetic wave. Hertz produced such waves
    experimentally in 1887–1888. This is the basis of radio, television and wireless communication.
technical:
  tr: >-
    "A Dynamical Theory of the Electromagnetic Field" (1865), yer değiştirme akımı terimini de içeren alan denklemlerini
    verir. Bu denklemlerden c = 1/√(μ₀ε₀) hızıyla yayılan enine dalgalar çıkar. Denklemlerin bugünkü dört vektör
    denklemi biçimi Heaviside ve Gibbs'e aittir. Denklemler Lorentz dönüşümleri altında değişmezdir ve özel göreliliğin
    çıkış noktası olmuştur.
  en: >-
    "A Dynamical Theory of the Electromagnetic Field" (1865) gives the field equations including the displacement-current
    term. They yield transverse waves travelling at c = 1/√(μ₀ε₀). The modern four-vector-equation form is due to
    Heaviside and Gibbs. The equations are invariant under Lorentz transformations and were the starting point of special
    relativity.
claims:
  - tr: Işık bir elektromanyetik dalgadır.
    en: Light is an electromagnetic wave.
    src: [maxwell1865]
evidence:
  - kind: experiment
    stance: for
    tr: Hertz, elektrik devreleriyle üretilen dalgaların yansıma, kırılma ve kutuplanma gösterdiğini ve sonlu hızla yayıldığını gösterdi.
    en: Hertz showed that waves produced by electric circuits reflect, refract and polarise, and travel at a finite speed.
    src: [hertz1893]
sources:
  maxwell1865:
    type: article
    authors: Maxwell, J. C.
    title: A dynamical theory of the electromagnetic field
    year: 1865
    in: Philosophical Transactions of the Royal Society of London 155, 459–512
    doi: 10.1098/rstl.1865.0008
  hertz1893:
