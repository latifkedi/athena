open:
  - tr: Ölçüm problemi, yani dalga fonksiyonunun neden tek bir sonuç verdiği, yorumlar arasında tartışmalıdır.
    en: The measurement problem, that is, why the wave function yields a single outcome, is disputed among interpretations.
