id: kuantum-mekanigi
parent: fizik
type: idea
date: { year: 1926 }
people: [Max Planck, Niels Bohr, Werner Heisenberg, Erwin Schrödinger, Paul Dirac, Max Born]
title:
  tr: Kuantum mekaniği
  en: Quantum mechanics
summary:
  tr: >-
    Atom ve atomaltı dünyada enerji paketler (kuantum) hâlinde alınıp verilir ve ölçüm sonuçları yalnızca olasılıklarla
    öngörülebilir. Kuram yarı iletkenlerden lazerlere kadar modern teknolojinin temelidir. Ölçümün ve "dalga
    fonksiyonunun" gerçekte ne anlama geldiği konusunda ise fizikçiler hâlâ farklı yorumlara sahiptir.
  en: >-
    In the atomic and subatomic world, energy is exchanged in packets (quanta) and the results of measurements can be
    predicted only as probabilities. The theory underlies modern technology from semiconductors to lasers. Physicists
    still hold different interpretations of what measurement and the "wave function" really mean.
technical:
  tr: >-
    Planck (1900) kara cisim ışımasını E = hν varsayımıyla açıkladı. Heisenberg'in matris mekaniği (1925) ve
    Schrödinger'in dalga mekaniği (1926) eşdeğer çıktı. Born kuralı |ψ|²'yi olasılık yoğunluğu olarak yorumlar.
    Kopenhag, çok dünyalı (Everett), de Broglie–Bohm pilot dalga ve nesnel çöküş (GRW) yorumları aynı deneysel
    tahminlerin çoğunu verir. Bell eşitsizliklerinin ihlali yerel gizli değişken kuramlarını dışlar. Boşluksuz testler
    2015'te yapılmıştır.
  en: >-
    Planck (1900) explained black-body radiation with the assumption E = hν. Heisenberg's matrix mechanics (1925) and
    Schrödinger's wave mechanics (1926) proved equivalent. The Born rule interprets |ψ|² as a probability density. The
    Copenhagen, many-worlds (Everett), de Broglie–Bohm pilot-wave and objective-collapse (GRW) interpretations share
    most experimental predictions. Violation of Bell inequalities rules out local hidden-variable theories; loophole-free
    tests were carried out in 2015.
claims:
  - tr: Enerji, frekansla orantılı paketler hâlinde (E = hν) alınıp verilir. Kuantum durumları dalga denklemiyle betimlenir.
    en: Energy is exchanged in packets proportional to frequency (E = hν); quantum states are described by a wave equation.
    src: [planck1901, schrodinger1926]
  - tr: Doğada yerel gizli değişkenlerle açıklanamayan korelasyonlar (dolanıklık) vardır.
    en: Nature contains correlations (entanglement) that cannot be explained by local hidden variables.
    src: [bell1964, hensen2015]
evidence:
  - kind: experiment
    stance: for
    tr: 1,3 km ayrılmış elektron spinleriyle yapılan boşluksuz Bell testi, yerel gerçekçiliğin öngördüğü sınırın ihlal edildiğini gösterdi.
    en: A loophole-free Bell test with electron spins separated by 1.3 km showed a violation of the bound predicted by local realism.
    src: [hensen2015]
  - kind: experiment
    stance: for
    tr: Aspect ve ekibinin 1982'deki deneyi, ölçüm ayarlarını foton uçuştayken değiştirerek Bell eşitsizliğinin ihlalini gösterdi.
    en: The 1982 experiment of Aspect and colleagues showed a violation of Bell's inequality with settings switched while the photons were in flight.
    src: [aspect1982]
positions:
  - who:
      tr: Kopenhag yorumu
      en: Copenhagen interpretation
    tr: Dalga fonksiyonu ölçüm sonuçlarına dair bilgimizi temsil eder. Ölçüm, klasik bir aygıtla yapılan ve olasılıklı sonuç veren bir süreçtir.
    en: The wave function represents our knowledge of measurement outcomes; measurement is a process involving a classical apparatus with probabilistic results.
    src: [sep-qm-copenhagen]
  - who:
      tr: Çok dünyalı yorum (Everett)
      en: Many-worlds interpretation (Everett)
    tr: Dalga fonksiyonu hiç çökmez. Her ölçümde evren, her olası sonucun gerçekleştiği dallara ayrılır.
    en: The wave function never collapses; at each measurement the universe branches into versions in which each possible outcome occurs.
    src: [everett1957]
  - who:
      tr: Pilot dalga yorumu (de Broglie–Bohm)
      en: Pilot-wave interpretation (de Broglie–Bohm)
    tr: Parçacıkların her zaman belirli konumları vardır. Bu konumlar yerel olmayan bir dalga tarafından yönlendirilir.
    en: Particles always have definite positions, guided by a non-local wave.
    src: [bohm1952]
