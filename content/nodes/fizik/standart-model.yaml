    authors: Particle Data Group (Navas, S. et al.)
    title: Review of Particle Physics
    year: 2024
    in: Physical Review D 110, 030001
    doi: 10.1103/PhysRevD.110.030001
  fukuda1998:
    type: article
    authors: Fukuda, Y. et al. (Super-Kamiokande Collaboration)
    title: Evidence for oscillation of atmospheric neutrinos
    year: 1998
    in: Physical Review Letters 81, 1562–1567
    doi: 10.1103/PhysRevLett.81.1562
