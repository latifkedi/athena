    doi: 10.2475/ajs.s3-34.203.333
  whittaker1910:
    type: book
    authors: Whittaker, E. T.
    title: A History of the Theories of Aether and Electricity
    year: 1910
    in: Longmans, Green and Co., London
  kostelecky2011:
    type: article
    authors: Kostelecký, V. A.; Russell, N.
    title: Data tables for Lorentz and CPT violation
    year: 2011
    in: Reviews of Modern Physics 83, 11–31
    doi: 10.1103/RevModPhys.83.11
related: [maxwell, ozel-gorelilik]
