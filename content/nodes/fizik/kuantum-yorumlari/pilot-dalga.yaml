    type: article
    authors: Bohm, D.
    title: A suggested interpretation of the quantum theory in terms of "hidden" variables. I
    year: 1952
    in: Physical Review 85, 166–179
    doi: 10.1103/PhysRev.85.166
  sep-qm-bohm:
