    authors: Google Quantum AI and Collaborators
    title: Quantum error correction below the surface code threshold
    year: 2025
    in: Nature 638, 920–926
    doi: 10.1038/s41586-024-08449-y
  pednault2019:
    type: preprint
    authors: Pednault, E.; Gunnels, J. A.; Nannicini, G.; Horesh, L.; Wisnieff, R.
    title: Leveraging secondary storage to simulate deep 54-qubit Sycamore circuits
    year: 2019
    arxiv: '1910.09534'
