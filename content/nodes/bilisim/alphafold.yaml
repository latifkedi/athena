id: alphafold
parent: bilisim
type: technology
date: { year: 2021, month: 7 }
people: [Demis Hassabis, John Jumper, David Baker]
title:
  tr: AlphaFold ve protein yapısı tahmini
  en: AlphaFold and protein structure prediction
summary:
  tr: >-
    Bir proteinin amino asit dizisinden üç boyutlu şeklini tahmin etmek, biyolojinin 50 yıllık problemlerinden biriydi.
    AlphaFold 2, 2020'deki CASP yarışmasında deneysel yöntemlere yakın doğrulukla tahminler yaptı. Hassabis, Jumper ve
    David Baker 2024 Nobel Kimya Ödülü'nü aldı. Tahminler hâlâ deneyle doğrulanması gereken modellerdir.
  en: >-
    Predicting a protein's three-dimensional shape from its amino-acid sequence was a 50-year-old problem in biology.
    AlphaFold 2 made predictions close to experimental accuracy at the CASP competition in 2020. Hassabis, Jumper and
    David Baker received the 2024 Nobel Prize in Chemistry. The predictions remain models that need experimental
    confirmation.
technical:
  tr: >-
    AlphaFold 2, çoklu dizi hizalamaları ve "Evoformer" dikkat bloklarıyla kalıntılar arası ilişkileri öğrenir.
    Yapısal modül de atom koordinatlarını uçtan uca üretir. CASP14'te medyan GDT_TS yaklaşık 92,4'tür. Model,
    düzensiz bölgeler, çoklu konformasyonlar ve mutasyonların etkisi gibi durumlarda daha az güvenilirdir. Tahminin güveni
    pLDDT puanıyla bildirilir.
  en: >-
    AlphaFold 2 learns inter-residue relationships with multiple sequence alignments and "Evoformer" attention blocks, and
    its structure module produces atomic coordinates end to end. The median GDT_TS at CASP14 was about 92.4. The model is
    less reliable for disordered regions, multiple conformations and the effects of mutations; prediction confidence is
    reported as a pLDDT score.
claims:
  - tr: Bir proteinin üç boyutlu yapısı, amino asit dizisinden çoğu durumda deneysel doğruluğa yakın tahmin edilebilir.
    en: A protein's 3D structure can in most cases be predicted from its amino-acid sequence with near-experimental accuracy.
    src: [jumper2021]
evidence:
  - kind: measurement
    stance: for
    tr: Kör değerlendirme yarışması CASP14'te tahminlerin çoğu deneysel yapılarla atom düzeyine yakın uyum gösterdi.
    en: In the blind assessment CASP14, most predictions matched experimental structures to near-atomic accuracy.
    src: [jumper2021]
  - kind: critique
    stance: against
    tr: Tahmin edilen yapıların ilaç tasarımında ve konformasyon değişikliklerini anlamada deneysel yapıların yerini tutmayabileceği vurgulandı.
    en: It was stressed that predicted structures may not substitute for experimental ones in drug design and in understanding conformational change.
    src: [terwilliger2024]
sources:
  jumper2021:
    type: article
    authors: Jumper, J. et al.
    title: Highly accurate protein structure prediction with AlphaFold
    year: 2021
    in: Nature 596, 583–589
    doi: 10.1038/s41586-021-03819-2
  terwilliger2024:
    type: article
    authors: Terwilliger, T. C. et al.
    title: AlphaFold predictions are valuable hypotheses and accelerate but do not replace experimental structure determination
    year: 2024
    in: Nature Methods 21, 110–116
    doi: 10.1038/s41592-023-02087-4
related: [biyoloji, derin-ogrenme]
