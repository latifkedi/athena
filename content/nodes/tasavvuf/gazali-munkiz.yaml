    tr: Gazzâlî'nin şüphe dönemi ve tasavvufa yönelişi, onun düşünce hayatının dönüm noktasıdır.
    en: "Al-Ghazālī's period of doubt and turn to Sufism mark the turning point of his intellectual life."
    src: [tdv-gazzali]
