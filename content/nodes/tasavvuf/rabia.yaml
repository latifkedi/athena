    src: [tdv-rabia]
positions:
  - who:
      tr: Tasavvuf geleneği
      en: Sufi tradition
    tr: Râbia, ilahi aşkı tasavvufa kazandıran, velî bir kadındır. Menkıbeler onun manevi hâlini yansıtır.
    en: Rābiʿa is a saintly woman who brought divine love into Sufism; the legends reflect her spiritual state.
    src: [tdv-rabia]
  - who:
      tr: Tarihsel eleştirel yaklaşım (Cornell)
      en: Historical-critical approach (Cornell)
    tr: Tarihsel Râbia hakkında çok az şey kesin olarak bilinir. Bugünkü Râbia imgesi, sonraki yazarların kendi dönemlerinin ideallerini yansıtan anlatılarından oluşmuştur.
    en: Very little is known for certain about the historical Rābiʿa; today's image of her was formed by later authors' narratives reflecting the ideals of their own times.
    src: [cornell2019]
