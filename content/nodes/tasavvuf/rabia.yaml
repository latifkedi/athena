id: rabia
parent: tasavvuf
type: tradition
people: [Râbia el-Adeviyye / Rābiʿa al-ʿAdawiyya]
title:
  tr: Râbia el-Adeviyye ve ilahi aşk
  en: Rābiʿa al-ʿAdawiyya and divine love
summary:
  tr: >-
    Basralı Râbia el-Adeviyye, tasavvufta Allah'ı cennet umudu ya da cehennem korkusu için değil, yalnızca kendisi için
    sevme anlayışının sembolü olmuş bir kadın sufidir. Bir elinde ateş, bir elinde suyla cenneti yakıp cehennemi
    söndürmek istediğini anlatan menkıbe bu anlayışı özetler. Kendisinden sonra gelen birçok sufiyi etkilediği kabul
    edilir. Hayatına dair bilgilerin çoğu, ölümünden yüzyıllar sonra yazılmış anlatılara dayanır.
  en: >-
    Rābiʿa al-ʿAdawiyya of Basra is a woman Sufi who became the symbol, in Sufism, of loving God for His own sake rather
    than in hope of paradise or fear of hell. The legend of her carrying fire in one hand and water in the other, to burn
    paradise and put out hell, sums up this idea. She is held to have influenced many later Sufis. Most information about
    her life rests on narratives written centuries after her death.
technical:
  tr: >-
    Râbia'ya atfedilen sözler ve şiirler en çok Sülemî, Kuşeyrî ve özellikle Ferîdüddin Attâr'ın Tezkiretü'l-evliyâ'sı
    gibi sonraki kaynaklarda yer alır. Cornell, Râbia imgesinin farklı dönemlerde zühd örneği, aşk mistiği ve bilge kadın
    olarak yeniden biçimlendiğini gösterir. Mahabbet (ilahi sevgi) kavramının tasavvufun merkezine yerleşmesinde Râbia
    adıyla anılan anlatıların rolü büyüktür.
  en: >-
    The sayings and verses attributed to Rābiʿa appear mostly in later sources such as Sulamī, Qushayrī and above all
    Farīd al-Dīn ʿAṭṭār's Tadhkirat al-awliyāʾ. Cornell shows how the image of Rābiʿa was reshaped in different periods as
    a model of asceticism, a love mystic and a wise woman. The narratives under her name played a large part in placing
    maḥabba (divine love) at the centre of Sufism.
claims:
  - tr: Allah'a ibadet cennet umuduyla ya da cehennem korkusuyla değil, yalnızca O'na duyulan sevgiyle yapılmalıdır.
    en: God should be worshipped not in hope of paradise or fear of hell but solely out of love for Him.
    src: [tdv-rabia, cornell2019]
