    tr: Smith, piyasaların kendiliğinden düzen oluşturma gücünün ve devlet müdahalesinin sınırlı tutulmasının savunucusudur.
    en: Smith is the advocate of markets' power to form spontaneous order and of limited state intervention.
    src: [smith1776]
  - who:
