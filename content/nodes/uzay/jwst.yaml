    tr: MoM-z14'ün tayfında Lyman-α kırılması ve beş morötesi salma çizgisi saptandı.
    en: A Lyman-α break and five rest-frame ultraviolet emission lines were detected in MoM-z14's spectrum.
    src: [naidu2025]
