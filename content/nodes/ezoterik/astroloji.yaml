positions:
  - who:
      tr: Fârâbî ve İslam bilim sınıflamaları
      en: al-Fārābī and Islamic classifications of the sciences
    tr: İki ayrı "yıldızlar ilmi" vardır. Biri yıldızların olaylara delâletini yorumlayan ahkâm-ı nücûm, diğeri matematiksel astronomi olan ta'lîmî nücûmdur.
    en: There are two distinct "sciences of the stars". One is aḥkām al-nujūm, which interprets what the stars signify about events; the other is mathematical astronomy (ʿilm al-nujūm al-taʿlīmī).
    src: [tdv-nucum]
