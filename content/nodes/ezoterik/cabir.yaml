claims:
  - tr: Metaller cıva ve kükürtün farklı oranlarda birleşmesinden oluşur ve oranların dengelenmesiyle dönüştürülebilir.
    en: Metals are formed by mercury and sulphur combining in different proportions and can be transmuted by balancing the proportions.
    src: [tdv-simya]
