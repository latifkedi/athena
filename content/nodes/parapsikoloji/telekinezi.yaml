    title: 'Mind/Machine Interaction Consortium: PortREG replication experiments'
    year: 2000
    in: Journal of Scientific Exploration 14(4), 499–555
  bosch2006:
    type: article
    authors: Bösch, H.; Steinkamp, F.; Boller, E.
    title: 'Examining psychokinesis: the interaction of human intention with random number generators — a meta-analysis'
    year: 2006
    in: Psychological Bulletin 132(4), 497–523
    doi: 10.1037/0033-2909.132.4.497
  wilson2006:
    type: article
    authors: Wilson, D. B.; Shadish, W. R.
    title: 'On blowing trumpets to the tulips: to prove or not to prove the null hypothesis — comment on Bösch, Steinkamp, and Boller (2006)'
    year: 2006
    in: Psychological Bulletin 132(4), 524–528
    doi: 10.1037/0033-2909.132.4.524
  radin2006:
    type: article
    authors: Radin, D.; Nelson, R.; Dobyns, Y.; Houtkooper, J.
    title: 'Reexamining psychokinesis: comment on Bösch, Steinkamp, and Boller (2006)'
    year: 2006
    in: Psychological Bulletin 132(4), 529–532
    doi: 10.1037/0033-2909.132.4.529
related: [kuantum-mekanigi]
