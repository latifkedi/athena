    doi: 10.1037/0033-2909.125.4.387
  storm2010:
    type: article
    authors: Storm, L.; Tressoldi, P. E.; Di Risio, L.
    title: 'Meta-analysis of free-response studies, 1992–2008: assessing the noise reduction model in parapsychology'
    year: 2010
    in: Psychological Bulletin 136(4), 471–485
    doi: 10.1037/a0019457
  rouder2013:
    type: article
    authors: Rouder, J. N.; Morey, R. D.; Province, J. M.
    title: 'A Bayes factor meta-analysis of recent extrasensory perception experiments: comment on Storm, Tressoldi, and Di Risio (2010)'
    year: 2013
    in: Psychological Bulletin 139(1), 241–247
    doi: 10.1037/a0029008
