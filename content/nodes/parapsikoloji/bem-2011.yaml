id: bem-2011
parent: parapsikoloji
type: event
date: { year: 2011, month: 3 }
people: [Daryl Bem, Stuart Ritchie, Richard Wiseman, Christopher French]
title:
  tr: '"Geleceği hissetmek" deneyleri'
  en: The "Feeling the future" experiments
summary:
  tr: >-
    Sosyal psikolog Daryl Bem, 2011'de psikolojinin en saygın dergilerinden birinde dokuz deney yayımladı. Bu deneylerde
    katılımcıların henüz gerçekleşmemiş olayları rastlantıdan biraz daha iyi "sezdiğini" bildirdi. Bağımsız tekrar
    çalışmaları etkiyi bulamadı. Tartışma, psikolojideki tekrarlama krizini başlatan olaylardan biri oldu.
  en: >-
    In 2011 the social psychologist Daryl Bem published nine experiments in one of psychology's most respected journals,
    reporting that participants "sensed" events that had not yet happened slightly better than chance. Independent
    replications did not find the effect. The controversy became one of the events that set off psychology's replication
    crisis.
technical:
  tr: >-
    Bem, bilinen etkileri (ör. duygusal hazırlama, alıştırma etkisi) zaman yönü tersine çevrilmiş biçimde test etti.
    Dokuz deneyin sekizinde anlamlı sonuç bildirdi. Ritchie, Wiseman ve French'in üç tekrarı etkiyi bulamadı ve makaleleri
    önce aynı dergi tarafından tekrar çalışması yayımlanmadığı gerekçesiyle reddedildi. Bem ve arkadaşlarının 2015'teki
    90 deneylik meta-analizi ise anlamlı bir etki bildirdi.
  en: >-
    Bem tested known effects (e.g. affective priming, practice effects) with the direction of time reversed and reported
    significant results in eight of nine experiments. Three replications by Ritchie, Wiseman and French found no effect;
    their paper was initially rejected by the same journal on the grounds that it did not publish replications. A 2015
    meta-analysis of 90 experiments by Bem and colleagues reported a significant effect.
claims:
  - tr: İnsanlar gelecekteki olayların etkisini rastlantıdan anlamlı biçimde daha iyi sezebilir (önsezi).
    en: People can anticipate the effect of future events significantly better than chance (precognition).
    src: [bem2011]
evidence:
  - kind: experiment
    stance: for
    tr: Dokuz deneyin sekizinde, ters zamanlı düzeneklerde küçük ama anlamlı etkiler bildirildi.
    en: Small but significant effects were reported in eight of nine time-reversed paradigms.
    src: [bem2011]
  - kind: statistical
    stance: for
    tr: 33 laboratuvardan 90 deneyi kapsayan bir meta-analiz anlamlı bir etki bildirdi.
    en: A meta-analysis of 90 experiments from 33 laboratories reported a significant effect.
    src: [bem2015]
  - kind: replication
    stance: against
    tr: Üç bağımsız tekrar çalışması, "hatırlamanın geriye dönük kolaylaştırılması" etkisini bulamadı.
    en: Three independent replications failed to find the "retroactive facilitation of recall" effect.
    src: [ritchie2012]
  - kind: critique
    stance: against
    tr: Sonuçların, analiz esnekliği ve psikolojideki standart istatistik uygulamalarının zayıflıklarıyla açıklanabileceği savunuldu.
    en: It was argued that the results can be explained by analytic flexibility and weaknesses in psychology's standard statistical practices.
    src: [wagenmakers2011]
