    title: Radial acceleration relation in rotationally supported galaxies
    year: 2016
    in: Physical Review Letters 117, 201101
    doi: 10.1103/PhysRevLett.117.201101
  chae2023:
    type: article
    authors: Chae, K.-H.
    title: Breakdown of the Newton–Einstein standard gravity at low acceleration in internal dynamics of wide binary stars
    year: 2023
    in: The Astrophysical Journal 952, 128
    doi: 10.3847/1538-4357/ace101
  banik2024:
    type: article
    authors: Banik, I.; Pittordis, C.; Sutherland, W.; Famaey, B.; Ibata, R.; Mieske, S.; Zhao, H.
    title: Strong constraints on the gravitational law from Gaia DR3 wide binaries
    year: 2024
    in: Monthly Notices of the Royal Astronomical Society 527(3), 4573–4615
    doi: 10.1093/mnras/stad3393
  clowe2006:
    type: article
