    title: Rotation of the Andromeda Nebula from a spectroscopic survey of emission regions
    year: 1970
    in: The Astrophysical Journal 159, 379–403
    doi: 10.1086/150317
  milgrom1983:
    type: article
    authors: Milgrom, M.
    title: A modification of the Newtonian dynamics as a possible alternative to the hidden mass hypothesis
    year: 1983
    in: The Astrophysical Journal 270, 365–370
    doi: 10.1086/161130
  clowe2006:
    type: article
    authors: Clowe, D. et al.
    title: A direct empirical proof of the existence of dark matter
    year: 2006
    in: The Astrophysical Journal Letters 648, L109–L113
    doi: 10.1086/508162
  lz2023:
    type: article
    authors: LZ Collaboration (Aalbers, J. et al.)
    title: First dark matter search results from the LUX-ZEPLIN (LZ) experiment
    year: 2023
    in: Physical Review Letters 131, 041002
    doi: 10.1103/PhysRevLett.131.041002
open:
  - tr: Karanlık madde varsa, hangi parçacıklardan oluşur?
    en: If dark matter exists, what particles is it made of?
