# Validates content on pull requests and non-default branches (no deploy).
name: Check content

on:
  pull_request:
  push:

jobs:
  check:
    if: github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
