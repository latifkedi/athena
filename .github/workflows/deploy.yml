# Builds the site and publishes it to GitHub Pages.
# - Every push to the default branch rebuilds the site.
# - On the 1st of every month (and when run by hand) it first pulls the newest
#   research, archives source links in the Wayback Machine, checks for broken links,
#   commits that data, opens a review list of papers that may concern existing nodes,
#   then rebuilds.
name: Deploy

on:
  push:
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Yeni makaleleri çek ve kaynakları arşivle / Fetch new papers and archive sources'
        type: boolean
        default: true
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write # the monthly review list is opened as an issue

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      # build the tip of the branch, not the commit that queued this run, so a run that waited
      # behind a monthly refresh still publishes the data that refresh pushed
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          # full history: node pages show when they were added and last changed
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch newest papers and archive sources
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        continue-on-error: true
        timeout-minutes: 30
        env:
          # all optional; see README "İsteğe bağlı ayarlar"
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          npm run feed
          npm run archive
          npm run links

      - name: Open the monthly review list
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run review
          if [ -s review.md ]; then
            title="$(head -n 1 review.md | sed 's/^# //')"
            if gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
              echo "An issue for this month is already open"
            else
              gh issue create --title "$title" --body-file review.md --label "inceleme" || gh issue create --title "$title" --body-file review.md
            fi
          fi

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/feed/latest.json content/archive.json content/linkcheck.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Aylık güncelleme: yeni makaleler ve arşiv bağlantıları"
            # the branch may have moved while the refresh was running
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              echo "Refreshed data pushed"
            else
              git rebase --abort 2>/dev/null || true
              echo "::warning::Could not push refreshed data; the site is still built with it"
            fi
          fi

      - name: Build (checks every node first)
        run: npm run build
        env:
          PUBLIC_GOATCOUNTER: ${{ vars.GOATCOUNTER }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
